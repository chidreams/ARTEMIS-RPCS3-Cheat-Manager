name: Build CustomTkinter Application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Change to match your target environment

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pyinstaller
          # pip install -r requirements.txt
        shell: bash

      - name: Locate CustomTkinter Installation Path
        id: ctk_path
        run: |
          echo "CTK_PATH=$(python -c 'import customtkinter, os; print(os.path.dirname(customtkinter.__file__))')" >> $GITHUB_ENV
        shell: bash

      - name: Build Executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "${{ env.CTK_PATH }};customtkinter/" --hidden-import customtkinter --add-data "src/logo.png;." --add-data "src/artemis_settings.json;." --name "ARTEMIS" src/cheat_manager.py
        shell: bash

      - name: Build Executable (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "${{ env.CTK_PATH }}:customtkinter/" --hidden-import customtkinter --add-data "src/logo.png;." --add-data "src/artemis_settings.json;." --name "ARTEMIS" src/cheat_manager.py
        shell: bash

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Build-${{ runner.os }}
          path: dist/
