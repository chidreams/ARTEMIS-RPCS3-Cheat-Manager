name: Build Standalone Artemis Executables

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: Artemis-Manager-Windows
            output_path: dist/Artemis-Manager-Windows.exe
            shell: pwsh

          - os: ubuntu-latest
            asset_name: Artemis-Manager-Linux
            output_path: dist/Artemis-Manager-Linux
            shell: bash

          - os: macos-latest
            asset_name: Artemis-Manager-macOS
            output_path: dist/Artemis-Manager-macOS.app
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y python3-tk tk-dev

    - name: Install Python Dependencies & PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Install Python Dependencies & PyInstaller (Linux & macOS)
      if: runner.os != 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build Windows Executable
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --noconsole --name "Artemis-Manager-Windows" src/cheat_manager.py

    - name: Build Linux Executable
      if: runner.os == 'Linux'
      run: |
        pyinstaller --onefile --noconsole --name "Artemis-Manager-Linux" src/cheat_manager.py

    - name: Build macOS Executable
      if: runner.os == 'macOS'
      run: |
        pyinstaller --onefile --windowed --name "Artemis-Manager-macOS" src/cheat_manager.py

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.output_path }}
